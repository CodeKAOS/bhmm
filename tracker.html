en);background:#31d07f10}.down{color:var(--red);background:#ff5f6810}.price{font-size:27px;font-weight:850;letter-spacing:-.035em;margin:17px 0 2px}.event{height:18px;color:var(--muted);font-size:11px;font-weight:800}.event.high{color:var(--green)}.event.low{color:var(--red)}.chartcontrols{display:flex;gap:5px;align-items:center;margin:10px 0 2px;flex-wrap:wrap}.chartcontrols button{padding:5px 8px;border-radius:8px;font-size:9px;letter-spacing:.03em;color:#8d98aa;background:#0d131d}.chartcontrols button.active{color:#fff;background:#273246;border-color:#53617a}.chartlabel{margin-left:auto;font-size:9px;color:var(--muted)}.chartbox{height:172px;margin:5px -5px 7px;position:relative}.chartbox canvas{width:100%;height:100%;display:block;cursor:crosshair}.charttip{position:absolute;display:none;pointer-events:none;z-index:5;min-width:108px;padding:7px 9px;border-radius:9px;background:#080d15eF;border:1px solid #344054;box-shadow:0 8px 24px #0008;color:#fff;font-size:11px;font-weight:800;transform:translate(-50%,-115%);white-space:nowrap}.charttip .tttime{display:block;margin-top:2px;color:#8d98aa;font-size:9px;font-weight:650}.charttip.show{display:block}.range{height:5px;background:#222a36;border-radius:999px;overflow:hidden;margin:11px 0 7px}.range i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--orange));border-radius:999px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px 13px;border-top:1px solid var(--line);padding-top:12px}.stat{min-width:0}.label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:750}.value{margin-top:3px;font-size:12px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lowtxt{color:#ff858c}.hitxt{color:#65e49c}.tradebox{margin-top:12px;padding:11px;border:1px solid var(--line);border-radius:12px;background:#0b111a}.tradehead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px}.tradehead .label{font-size:10px}.tradepick{font-size:11px;font-weight:850;padding:4px 7px;border-radius:8px;background:#1a2230;color:#dce4ef}.tradegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tradeopt{padding:9px;border-radius:10px;background:#121a25;border:1px solid #202a38}.tradeopt.best{border-color:#41516a;background:#151f2c}.tradeopt .side{font-size:10px;font-weight:900;letter-spacing:.08em}.tradeopt .gain{font-size:17px;font-weight:900;margin-top:3px}.tradeopt .target{font-size:10px;color:var(--muted);margin-top:2px}.upside .side,.upside .gain{color:var(--green)}.downside .side,.downside .gain{color:var(--red)}.tradefoot{display:none}.empty{color:var(--muted);display:grid;place-items:center;height:100%;font-size:12px}@media(max-width:1150px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.coin.selected{grid-column:1/-1}}@media(max-width:680px){.wrap{padding:18px 12px 40px}.top{align-items:flex-start;flex-direction:column}.actions{justify-content:flex-start}.statusbar{grid-template-columns:1fr 1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.coin.selected{grid-column:1/-1}.coin:not(.selected) .chartbox{height:58px}.brand h1{font-size:21px}.price{font-size:25px}.footer{flex-direction:column}}

</style></head><body><div id="loginScreen" class="login-screen"><form id="loginForm" class="login-card"><div class="login-brand"><div class="login-mark">₿</div><div><div class="login-title">Bitcoin Hero</div><div class="login-sub">Secure market monitor</div></div></div><label for="loginUser">Username</label><input id="loginUser" name="username" autocomplete="username" required autofocus><label for="loginPass">Password</label><div class="password-row"><input id="loginPass" name="password" type="password" autocomplete="current-password" required><button id="togglePassword" type="button">Show</button></div><button class="login-submit" type="submit">Sign in</button><div id="loginError" class="login-error" role="alert"></div><div class="login-hint">Sign in to view live prices and protected market records.</div></form></div><div id="dashboard" hidden><div class="wrap">
<div class="top"><div class="brand"><div class="logo">B</div><div><div class="eyebrow">Live simulated market · Tracker v21</div><h1>Bitcoin Hero Market Monitor <span style="font-size:12px;vertical-align:middle;color:#f7931a;border:1px solid #68451f;border-radius:7px;padding:3px 6px;letter-spacing:.04em">v21</span></h1></div></div><div class="actions"><button id="importBtn">Import & Merge CSV</button><button id="csv">Export cloud CSV</button><button id="logoutBtn" class="logout">Log out</button><input id="importFile" type="file" accept=".csv,text/csv" hidden></div></div>
<div class="statusbar"><div class="live"><span id="dot" class="dot off"></span><span id="status">Connecting…</span></div><div class="meta">Last update <b id="time">—</b></div><div class="meta">API tick <b id="tick">—</b></div><div class="meta">Session <b id="session">0 samples</b></div></div>
<div id="cards" class="cards"></div>

</div></div><script>
const syms=['BTC','ETH','SOL','DOGE','XRP','ADA','LINK','AVAX'];
let selectedSym='BTC';
const names={BTC:'Bitcoin',ETH:'Ethereum',SOL:'Solana',DOGE:'Dogecoin',XRP:'XRP',ADA:'Cardano',LINK:'Chainlink',AVAX:'Avalanche'};
const accent={BTC:'#f7931a',ETH:'#8c9eff',SOL:'#b06dff',DOGE:'#d4b455',XRP:'#3fb8e8',ADA:'#4f79e0',LINK:'#5f83e8',AVAX:'#e8784f'};
let state={},lastCoins={},sessionSamples=0,chartRange=Object.fromEntries(syms.map(s=>[s,'live'])),chartHover=Object.fromEntries(syms.map(s=>[s,null])),historyCache={};
function fmt(n){if(n==null||!isFinite(n))return '—';let a=Math.abs(n);if(a<1)return '$'+Number(n).toFixed(6).replace(/0+$/,'').replace(/\.$/,'');return '$'+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function when(t){return t?new Date(t).toLocaleString():'Baseline'}
function makeCards(){cards.innerHTML=syms.map(sym=>`<article class="coin" id="card-${sym}"><div class="coinhead"><div class="identity"><div class="coinlogo ${sym.toLowerCase()}">${{BTC:'₿',ETH:'◆',SOL:'≋',DOGE:'Ð',XRP:'X',ADA:'⠿',LINK:'⬡',AVAX:'▲'}[sym]}</div><div><div class="name">${sym}</div><div class="fullname">${names[sym]}</div></div></div><div id="chg-${sym}" class="chg">—</div></div><div id="price-${sym}" class="price">—</div><div id="event-${sym}" class="event">Waiting for feed</div><div class="chartcontrols" id="controls-${sym}"><button data-r="live" class="active">LIVE</button><button data-r="1h">1H</button><button data-r="4h">4H</button><button data-r="1d">1D</button><button data-r="all">ALL</button><span class="chartlabel" id="chartlabel-${sym}">Last 5 min</span></div><div class="chartbox" id="chartbox-${sym}"><canvas id="chart-${sym}"></canvas><div class="charttip" id="tip-${sym}"></div></div><div class="range"><i id="range-${sym}" style="width:0"></i></div><div class="stats"><div class="stat"><div class="label">Observed low</div><div id="low-${sym}" class="value lowtxt">—</div></div><div class="stat"><div class="label">Observed high</div><div id="high-${sym}" class="value hitxt">—</div></div></div><div class="tradebox"><div class="tradehead"><span class="label">Potential trade range</span><span id="pick-${sym}" class="tradepick">Waiting</span></div><div class="tradegrid"><div id="upopt-${sym}" class="tradeopt upside"><div class="side">▲ UP</div><div id="upgain-${sym}" class="gain">—</div><div id="uptarget-${sym}" class="target">to observed high</div></div><div id="downopt-${sym}" class="tradeopt downside"><div class="side">▼ DOWN</div><div id="downgain-${sym}" class="gain">—</div><div id="downtarget-${sym}" class="target">to observed low</div></div></div></div></article>`).join('')}

function key(sym){return sym+':'+(chartRange[sym]||'live')}
async function loadHistory(sym,force=false){let k=key(sym);if(!force&&historyCache[k])return historyCache[k];let r=await fetch('/api/history?symbol='+sym+'&range='+(chartRange[sym]||'live'),{cache:'no-store'});if(!r.ok)throw Error('history '+r.status);let d=await r.json();historyCache[k]=d.candles||[];return historyCache[k]}
function chartPoints(sym){return historyCache[key(sym)]||[]}
function draw(sym){
 let cv=document.getElementById('chart-'+sym);if(!cv)return;let box=cv.parentElement,r=box.getBoundingClientRect(),dpr=devicePixelRatio||1;
 cv.width=Math.max(1,r.width*dpr);cv.height=Math.max(1,r.height*dpr);let ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
 let w=r.width,h=r.height,mini=sym!==selectedSym,axisW=mini?0:62,plotW=Math.max(30,w-axisW);ctx.clearRect(0,0,w,h);
 let pts=chartPoints(sym),mode=chartRange[sym]||'live',labels={live:'LIVE · 5 min', '1h':'1H','4h':'4H','1d':'1D',all:'ALL · saved history'};
 let lab=document.getElementById('chartlabel-'+sym);if(lab)lab.textContent=(labels[mode]||'Price history')+' · '+pts.length+' points';
 if(!pts.length){ctx.fillStyle='#7f8999';ctx.font='11px system-ui';ctx.textAlign='center';ctx.fillText('Collecting price history…',plotW/2,h/2);return}
 let values=pts.map(p=>Number(p.close)).filter(v=>Number.isFinite(v)&&v>0),current=Number(lastCoins[sym]?.price);if(Number.isFinite(current)&&current>0)values.push(current);let lo=Math.min(...values),hi=Math.max(...values),pad=(hi-lo)*.12||Math.abs(hi)*.002||1;lo-=pad;hi+=pad;
 let top=mini?5:12,bottom=mini?h-5:h-16,y=v=>top+(hi-v)/(hi-lo)*(bottom-top);let n=pts.length;
 if(!mini){ctx.font='9px system-ui';ctx.textBaseline='middle';ctx.textAlign='right';ctx.strokeStyle='#252d3b';ctx.lineWidth=1;for(let i=0;i<=4;i++){let value=hi-(hi-lo)*i/4,yy=y(value);ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(plotW-4,yy);ctx.stroke();ctx.fillStyle='#9aa5b5';let digits=Math.abs(value)<1?4:Math.abs(value)<100?2:0;ctx.fillText(value.toLocaleString(undefined,{minimumFractionDigits:digits,maximumFractionDigits:digits}),w-2,yy)}}
 let step=plotW/Math.max(1,n-1);ctx.beginPath();let started=false;pts.forEach((p,i)=>{let v=Number(p.close);if(!Number.isFinite(v)||v<=0)return;let xx=n===1?plotW/2:step*i,yy=y(v);if(!started){ctx.moveTo(xx,yy);started=true}else ctx.lineTo(xx,yy)});ctx.strokeStyle=accent[sym]||'#7aa2ff';ctx.lineWidth=mini?1.6:2.2;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();
 if(!mini&&Number.isFinite(current)&&current>0){let yy=y(current);ctx.save();ctx.setLineDash([4,4]);ctx.strokeStyle=accent[sym]||'#7aa2ff';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(plotW-1,yy);ctx.stroke();ctx.restore();ctx.fillStyle=accent[sym]||'#7aa2ff';ctx.fillRect(plotW-1,Math.max(yy-9,0),axisW+1,18);ctx.fillStyle='#fff';ctx.textAlign='left';ctx.font='bold 9px system-ui';ctx.fillText(fmt(current),plotW+4,Math.max(yy,8));}
 let hv=chartHover[sym];if(!mini&&hv!=null&&hv>=0&&hv<pts.length){let p=pts[hv],xx=n===1?plotW/2:step*hv,yy=y(Number(p.close));ctx.save();ctx.setLineDash([3,3]);ctx.strokeStyle='#aab4c4aa';ctx.beginPath();ctx.moveTo(xx,4);ctx.lineTo(xx,h-4);ctx.stroke();ctx.restore();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(xx,yy,3,0,Math.PI*2);ctx.fill();let tip=document.getElementById('tip-'+sym);tip.innerHTML=`${fmt(p.close)}<span class="tttime">${new Date(p.ts).toLocaleString()}</span>`;tip.style.left=Math.max(70,Math.min(plotW-70,xx))+'px';tip.style.top=Math.max(38,yy)+'px';tip.classList.add('show')}
}
function hoverChart(sym,clientX){let cv=document.getElementById('chart-'+sym),r=cv.getBoundingClientRect(),pts=chartPoints(sym);if(!pts.length)return;let rel=Math.max(0,Math.min(1,(clientX-r.left)/(r.width-48))),best=Math.max(0,Math.min(pts.length-1,Math.floor(rel*pts.length)));chartHover[sym]=best;draw(sym)}
function clearHover(sym){chartHover[sym]=null;let tip=document.getElementById('tip-'+sym);if(tip)tip.classList.remove('show');draw(sym)}
function ringColor(g){if(!Number.isFinite(g))return '#667085';if(g>=50)return '#ff3b6b';if(g>=25)return '#ff8a3d';if(g>=15)return '#ffd166';if(g>=8)return '#64d98b';if(g>=3)return '#4db8ff';return '#718096'}
function ringScale(g){return Number.isFinite(g)?Math.max(3,Math.min(100,g/50*100)):0}
function render(){for(const sym of syms){let c=lastCoins[sym]||{},s=state[sym]||{},p=Number(c.price);document.getElementById('price-'+sym).textContent=fmt(p);let ch=document.getElementById('chg-'+sym),change=c.change;ch.textContent=change==null?'—':`${change>=0?'+':''}${Number(change).toFixed(2)}%`;ch.className='chg '+(change==null?'':change>=0?'up':'down');document.getElementById('low-'+sym).textContent=fmt(s.low);document.getElementById('high-'+sym).textContent=fmt(s.high);let valid=Number.isFinite(p)&&p>0&&Number.isFinite(s.low)&&Number.isFinite(s.high);let pos=(valid&&s.high>s.low)?Math.max(0,Math.min(100,(p-s.low)/(s.high-s.low)*100)):0;document.getElementById('range-'+sym).style.width=pos+'%';let up=valid?Math.max(0,(s.high-p)/p*100):NaN,down=valid?Math.max(0,(p-s.low)/p*100):NaN;document.getElementById('upgain-'+sym).textContent=Number.isFinite(up)?'+'+up.toFixed(2)+'%':'—';document.getElementById('downgain-'+sym).textContent=Number.isFinite(down)?'+'+down.toFixed(2)+'%':'—';document.getElementById('uptarget-'+sym).textContent=valid?'to '+fmt(s.high):'to observed high';document.getElementById('downtarget-'+sym).textContent=valid?'to '+fmt(s.low):'to observed low';let pick=document.getElementById('pick-'+sym),uo=document.getElementById('upopt-'+sym),dn=document.getElementById('downopt-'+sym);uo.classList.remove('best');dn.classList.remove('best');if(valid&&up>down){pick.textContent='UP · '+up.toFixed(2)+'% range';pick.className='tradepick up';uo.classList.add('best')}else if(valid){pick.textContent='DOWN · '+down.toFixed(2)+'% range';pick.className='tradepick down';dn.classList.add('best')}let ev=(window.latestEvents||{})[sym];let e=document.getElementById('event-'+sym);e.textContent=ev&&ev.type?`${ev.type} · ${fmt(ev.price)}`:`Cloud samples · ${s.samples||0}`;e.className='event '+(ev?.type==='NEW HIGH'?'high':ev?.type==='NEW LOW'?'low':'');draw(sym)}}
async function poll(){try{let r=await fetch('/api/state?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json();state=d.records||{};window.latestEvents=d.events||{};lastCoins={};for(const sym of syms){let x=d.coins?.[sym]||{};lastCoins[sym]={price:x.price,change:x.change,ts:x.ts}}sessionSamples++;status.textContent=d.server?.ok?'Cloud collector live':'Collector warning';dot.classList.toggle('off',!d.server?.ok);time.textContent=d.server?.last_poll?new Date(d.server.last_poll).toLocaleTimeString():'—';tick.textContent=(d.server?.tick_ms||3000)+' ms';session.textContent=sessionSamples+' dashboard polls';render()}catch(e){status.textContent='Dashboard connection error';dot.classList.add('off');time.textContent=e.message}}
let loggedIn=false,pollTimer=null;
const loginScreen=document.getElementById('loginScreen'),dashboard=document.getElementById('dashboard'),loginForm=document.getElementById('loginForm'),loginError=document.getElementById('loginError');
function showDashboard(){loggedIn=true;loginScreen.style.display='none';dashboard.hidden=false;poll();if(!pollTimer)pollTimer=setInterval(()=>{if(loggedIn)poll()},3000)}
loginForm.addEventListener('submit',async e=>{e.preventDefault();loginError.textContent='';let b=loginForm.querySelector('button[type=submit]');b.disabled=true;b.textContent='Signing in…';try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('loginUser').value,password:document.getElementById('loginPass').value})});let d=await r.json();if(!r.ok)throw Error(d.error||'Unable to sign in');showDashboard()}catch(err){loginError.textContent=err.message||'Incorrect username or password'}finally{b.disabled=false;b.textContent='Sign in'}});
document.getElementById('togglePassword').onclick=()=>{let p=document.getElementById('loginPass'),b=document.getElementById('togglePassword');p.type=p.type==='password'?'text':'password';b.textContent=p.type==='password'?'Show':'Hide'};
document.getElementById('logoutBtn').onclick=async()=>{try{await fetch('/api/logout',{method:'POST'})}catch{}loggedIn=false;dashboard.hidden=true;loginScreen.style.display='flex';loginForm.reset();loginError.textContent='You have signed out.'};
async function checkSession(){try{let r=await fetch('/api/state',{cache:'no-store'});if(r.ok){showDashboard();return}}catch{}loginScreen.style.display='flex';dashboard.hidden=true}
makeCards();document.getElementById('card-'+selectedSym).classList.add('selected');for(const sym of syms){let cv=document.getElementById('chart-'+sym);cv.addEventListener('mousemove',e=>hoverChart(sym,e.clientX));cv.addEventListener('mouseleave',()=>clearHover(sym));cv.addEventListener('touchstart',e=>{if(e.touches[0])hoverChart(sym,e.touches[0].clientX)},{passive:true});cv.addEventListener('touchmove',e=>{if(e.touches[0])hoverChart(sym,e.touches[0].clientX)},{passive:true});cv.addEventListener('touchend',()=>setTimeout(()=>clearHover(sym),900),{passive:true})}
document.getElementById('cards').addEventListener('click',async e=>{let card=e.target.closest('.coin');if(card){let sym=card.id.replace('card-','');if(sym!==selectedSym){selectedSym=sym;document.querySelectorAll('.coin').forEach(x=>x.classList.toggle('selected',x.id==='card-'+sym));document.getElementById('cards').prepend(card);syms.forEach(draw)}}let b=e.target.closest('.chartcontrols button');if(!b)return;let controls=b.closest('.chartcontrols'),sym=controls.id.replace('controls-','');chartRange[sym]=b.dataset.r;controls.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));await loadHistory(sym,true);draw(sym)});
document.getElementById('csv').onclick=()=>location.href='/api/export.csv';
importBtn.onclick=()=>importFile.click();importFile.onchange=async()=>{let f=importFile.files&&importFile.files[0];if(!f)return;if(!confirm('Merge '+f.name+' into the cloud tracker? Existing data will be preserved and a database backup will be created first.')){importFile.value='';return}try{status.textContent='Importing…';let r=await fetch('/api/import',{method:'POST',headers:{'Content-Type':'text/csv'},body:await f.arrayBuffer()});let d=await r.json();if(!r.ok)throw Error(d.error||('HTTP '+r.status));alert(`Import complete\n\n${d.priceRecordsAdded} price records added\n${d.eventsAdded} extrema events added\n${d.duplicatesSkipped} duplicates skipped\n${d.cryptosUpdated} cryptos updated\n\nBackup: ${d.backup}`);historyCache={};await poll()}catch(e){alert('Import failed: '+e.message);status.textContent='Import failed'}finally{importFile.value=''}};
addEventListener('resize',()=>syms.forEach(draw));checkSession();
</script></body></html>
